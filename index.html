<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7e7e5" />
    <title>纪·象｜双游戏入口</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;overflow-x:hidden;color:#19363b;background:radial-gradient(circle at 18% 10%,#fff 0 5%,transparent 28%),linear-gradient(145deg,#d7e7e5,#f4ead2 54%,#b8cfca);font-family:Inter,"Microsoft YaHei",sans-serif}.hub{width:min(900px,100%)}.hub>small{color:#a06432;font-size:14px;font-weight:900;letter-spacing:.18em}.hub h1{margin:8px 0 5px;font:700 clamp(32px,6vw,54px)/1.05 Georgia,"Songti SC",serif}.hub>p{margin:0 0 22px;color:#637a78;font-size:16px}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.game{display:grid;min-height:250px;padding:22px;align-content:end;border:1px solid #fff9;border-radius:24px;color:#fff;text-decoration:none;box-shadow:0 22px 60px #173f4538;transition:transform .2s ease,box-shadow .2s ease}.game:hover,.game:focus-visible{outline:3px solid #d8a646;outline-offset:3px;transform:translateY(-4px);box-shadow:0 28px 70px #173f4552}.game small{font-size:14px;font-weight:900;letter-spacing:.12em}.game b{margin:7px 0 5px;font:700 28px Georgia,"Songti SC",serif}.game span{max-width:34em;font-size:16px;line-height:1.6;opacity:.92}.paleo{background:linear-gradient(160deg,#315f5bde,#173f45f2),radial-gradient(circle at 70% 20%,#d8a646,transparent 40%)}.mammoth{background:linear-gradient(160deg,#7b6548db,#263c38f2),radial-gradient(circle at 70% 18%,#e5c77b,transparent 42%)}@media(max-width:640px){body{padding:12px}.games{grid-template-columns:1fr}.game{min-height:190px;padding:18px;border-radius:18px}}
    </style>
  </head>
  <body>
    <main class="hub">
      <small>纪·象 · TWO GAMES</small>
      <h1>选择游戏</h1>
      <p>联合正式版仅保留玩家使用的两款游戏。</p>
      <section class="games" aria-label="游戏列表">
        <a class="game paleo" href="./paleo21/index.html">
          <small>GAME 01 · STRATEGY</small>
          <b>冰河史前21点</b>
          <span>普通模式与 AR 模式均可进入，并保留双端联机。</span>
        </a>
        <a class="game mammoth" href="./mammoth/index.html">
          <small>GAME 02 · SURVIVAL</small>
          <b>猛犸的迁徙与灭绝</b>
          <span>操控象群穿越冰原生态，应对捕食者、人类与环境变化。</span>
        </a>
      </section>
    </main>
  </body>
</html>
